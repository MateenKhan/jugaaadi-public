# Local test server — the production config minus TLS.
#
# `public.jugaaadi.com.conf` cannot run locally: it terminates TLS and points at
# certificate paths that only exist once certbot has run on the VPS. This is the
# same file with the TLS server block flattened to plain HTTP on :80, so every
# rule that can actually be wrong locally — the asset cache headers, the
# never-cache-HTML rule, try_files, SAMEORIGIN, gzip — is exercised for real
# instead of being assumed correct until deploy day.
#
# Run it (from the repo root, after `npm run build`):
#
#   docker run --rm -d --name jugaaadi-nginx -p 8088:80 \
#     -v "$(pwd)/apps/showcase/dist:/var/www/public.jugaaadi.com:ro" \
#     -v "$(pwd)/deploy/nginx/local-test.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
#
# then open http://localhost:8088 — and `docker rm -f jugaaadi-nginx` when done.
#
# Keep the rules below in sync with public.jugaaadi.com.conf; only the listen
# directive and the TLS lines should differ.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/public.jugaaadi.com;
    index index.html;

    # The demos run in iframes from this same origin, so SAMEORIGIN — not DENY.
    #
    # Repeated in every location below that sets its own add_header, because
    # nginx drops ALL inherited add_headers as soon as a nested block declares
    # one. This config is what caught that: the headers were silently absent.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-declared because this block has its own add_header — see above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # HTML must never be cached, or a deploy ships new assets behind a stale
    # document that still references the old hashed filenames. `expires -1` is
    # deliberately omitted: it emits its own Cache-Control: no-cache, which
    # arrives alongside the one below as a doubled header value.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Re-declared because this block has its own add_header — see above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Tabs are hash routes (#/joystick), so the server only ever serves real
    # files — index.html at the root and the per-demo documents under /demos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
