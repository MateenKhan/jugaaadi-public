# public.jugaaadi.com — static showcase for the @jugaaadi packages.
#
# Install on the VPS:
#   sudo cp deploy/nginx/public.jugaaadi.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/public.jugaaadi.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run certbot AFTER the port-80 block below is live, and it will rewrite
# this file in place with the managed certificate lines:
#   sudo certbot --nginx -d public.jugaaadi.com

server {
    listen 80;
    listen [::]:80;
    server_name public.jugaaadi.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name public.jugaaadi.com;

    # certbot fills these in; they are placeholders until it runs.
    ssl_certificate     /etc/letsencrypt/live/public.jugaaadi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.jugaaadi.com/privkey.pem;

    root /var/www/public.jugaaadi.com;
    index index.html;

    access_log /var/log/nginx/public.jugaaadi.com.access.log;
    error_log  /var/log/nginx/public.jugaaadi.com.error.log;

    # The demos run in iframes from this same origin, so SAMEORIGIN — not DENY.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # HTML must never be cached, or a deploy ships new assets behind a stale
    # document that still references the old hashed filenames.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Tabs are hash routes (#/joystick), so the server only ever serves real
    # files — index.html at the root and the per-demo documents under /demos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
